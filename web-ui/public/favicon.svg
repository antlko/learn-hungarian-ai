<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The teal is the app's identity hue (198) — oklch(0.47 0.08 198), the light
       palette's --primary, as sRGB — on which the paper-white «ő» sits at 5.4:1.
       The glyph: the double acute is the diacritic learners of Hungarian most
       often drop, and the one the ear trainer targets first. The serif stack is
       the material's face (ADR-036); a tab renders with whatever the OS has, so
       Georgia stands in when Literata is not installed there. -->
  <rect width="32" height="32" rx="7" fill="#00686b"/>
  <text x="16" y="23" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="21"
        font-weight="500" fill="#fbfaf7" text-anchor="middle">ő</text>
</svg>
