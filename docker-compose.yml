# tanulom — copy this file and run `docker compose up -d`.
#
# The core service is the whole product: SRS, reader, grammar, ear training,
# listening and progress all work with nothing else running. The profiles below
# are strictly additive; the app probes them at runtime and disables the
# features that need them, with a visible reason.
#
#   docker compose up -d                                 core only
#   docker compose --profile speech up -d                + TTS and ASR
#   docker compose --profile nlp --profile speech up -d  + HuSpaCy
#   docker compose --profile llm up -d                   + a local model
#   docker compose --profile mt up -d                    + sentence translation
#
# Tired of typing the flag? Put the profiles you want in a `.env` beside this
# file — `COMPOSE_PROFILES=mt` — and plain `docker compose up -d` brings them
# up with everything else. See .env.example.
#
# NOTE (v0.1): the `nlp` and `speech` services are NOT IMPLEMENTED YET — those
# build contexts are empty, so those two profiles will fail to start. They are
# declared here so the intended topology is visible. See services/README.md.
# The `llm` profile works today: it pulls a published Ollama image, and so does
# `mt`, which builds from source in this repository.

services:
  tanulom:
    image: ghcr.io/antlko/learn-hungarian-ai:latest
    # To build from source instead of pulling, comment out `image:` above and
    # uncomment the next line:
    # build: .
    container_name: tanulom
    ports:
      # host:container. Both are 8012 because config.DefaultAddr is, and the
      # Dockerfile no longer overrides it — change only the left-hand number.
      - '8012:8012'
    volumes:
      - tanulom-data:/data
    environment:
      TANULOM_LOG_LEVEL: info
      # Timezone for "today": the daily new-card budget, sibling burial and the
      # streak day all roll over at local midnight. Unset, the container runs on
      # UTC. The binary embeds tzdata, so any IANA name works.
      # TZ: Europe/Budapest
    restart: unless-stopped

  # --- optional: Hungarian text analysis (HuSpaCy) --------------------------
  # Enables context-aware disambiguation (vár = castle vs. waits) and analysis
  # of forms absent from the language pack. Without it the app falls back to the
  # pack's frequency prior and marks such analyses as uncertain.
  nlp:
    profiles: ['nlp']
    build: ./services/nlp
    container_name: tanulom-nlp
    expose:
      - '5002'
    restart: unless-stopped

  # --- optional: speech ------------------------------------------------------
  # Piper gives three Hungarian voices for card audio and ear training; the
  # Whisper fine-tune transcribes your speech. Note that Hungarian ASR has a
  # word error rate around 11%, so the app gates its feedback on confidence.
  tts:
    profiles: ['speech']
    build: ./services/tts
    container_name: tanulom-tts
    expose:
      - '5000'
    volumes:
      - tanulom-voices:/voices
    restart: unless-stopped

  asr:
    profiles: ['speech']
    build: ./services/asr
    container_name: tanulom-asr
    expose:
      - '5001'
    volumes:
      - tanulom-models:/models
    restart: unless-stopped

  # --- optional: sentence translation ---------------------------------------
  # NLLB-200-distilled-600M on your own CPU, so "what does this line mean?" in
  # the reader is answered here instead of in someone else's chat window. The
  # model weights are CC-BY-NC — fine for your own learning, which is why this
  # is opt-in and not in the published image. Build is slow the first time: it
  # downloads and converts ~2.4 GB.
  mt:
    profiles: ['mt']
    build: ./services/mt
    container_name: tanulom-mt
    expose:
      - '5003'
    volumes:
      # The converted weights survive an image rebuild. Without this, every
      # `docker compose build` throws away 2.4 GB and downloads it again — and
      # the service spends its first minutes back at 503 while a learner who
      # only wanted a new app version watches the translator "break".
      - tanulom-mt:/models
    restart: unless-stopped

  # --- optional: local language model ---------------------------------------
  # Alternatively, point Settings -> Services -> LLM at any OpenAI-compatible
  # endpoint. Keys are stored in the database, never in config.yaml.
  ollama:
    profiles: ['llm']
    image: ollama/ollama:latest
    container_name: tanulom-ollama
    expose:
      - '11434'
    environment:
      # Ollama defaults to a 4k context and truncates a longer prompt SILENTLY,
      # from the head -- which is exactly where the tutor puts the lesson it was
      # told to ground the answer in. Measured: a 16,000-character system message
      # came back reported as 2,050 prompt tokens. The tutor's budgets are sized
      # for 8k. See docs/TUTOR.md section 9.
      OLLAMA_CONTEXT_LENGTH: '8192'
    volumes:
      # Pulled models live here, so `ollama pull` survives a recreate. Without
      # it every `docker compose up` re-downloads several GB.
      - tanulom-ollama:/root/.ollama
    restart: unless-stopped

volumes:
  tanulom-data:
  tanulom-mt:
  tanulom-voices:
  tanulom-models:
  tanulom-ollama:
