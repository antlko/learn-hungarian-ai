# tanulom — copy this file and run `docker compose up -d`.
#
# The core service is the whole product: SRS, reader, grammar, ear training,
# listening and progress all work with nothing else running. The profiles below
# are strictly additive; the app probes them at runtime and disables the
# features that need them, with a visible reason.
#
#   docker compose up -d                                 core only
#   docker compose --profile nlp up -d                   + HuSpaCy (needs >= 2.4 GB RAM)
#   docker compose --profile llm up -d                   + a local model
#   docker compose --profile mt up -d                    + sentence translation
#
# Tired of typing the flag? Put the profiles you want in a `.env` beside this
# file — `COMPOSE_PROFILES=mt,llm` — and plain `docker compose up -d` brings them
# up with everything else. See .env.example.
#
# `profiles` marks a service optional: it does not start unless asked for with
# `--profile X` or COMPOSE_PROFILES. The sidecars publish NO host ports (only
# `expose:`): they are reachable by service name on the compose network
# (http://nlp:5002), so they cannot clash with anything on your host. Add `ports:`
# yourself only if you want to reach one from outside.
#
# NOTE: the `speech` services (tts, asr) are NOT BUILT yet and are commented out
# below, so no profile ever points at a missing build context. `nlp` and `mt`
# build from source in this repository; `llm` pulls a published Ollama image.
# See services/README.md.

services:
  tanulom:
    image: ghcr.io/antlko/learn-hungarian-ai:latest
    # To build from source instead of pulling, comment out `image:` above and
    # uncomment the next line (target: full = the Python-capable image, like
    # :latest; a plain `build: .` builds the distroless slim one):
    # build: {context: ., target: full}
    #
    # `:latest` carries Python, so Settings -> Components can install the
    # analyser/translator inside this one container (no sidecars). `:latest-full`
    # is an alias of it. ALTERNATIVE: the smaller distroless image without Python
    # (same uid and /data layout, so switching keeps your data). Replace `image:`
    # above with either of:
    # image: ghcr.io/antlko/learn-hungarian-ai:latest-slim
    # build: .
    # (`build: {context: ., target: full}` builds the Python one from source.)
    container_name: tanulom
    ports:
      # host:container. Both are 8012 because config.DefaultAddr is, and the
      # Dockerfile no longer overrides it — change only the left-hand number.
      - '8012:8012'
    volumes:
      - tanulom-data:/data
    environment:
      TANULOM_LOG_LEVEL: info
      # Timezone for "today": the daily new-card budget, sibling burial and the
      # streak day all roll over at local midnight. Unset, the container runs on
      # UTC. The binary embeds tzdata, so any IANA name works.
      # TZ: Europe/Budapest
    restart: unless-stopped

  # --- optional: Hungarian text analysis (HuSpaCy) --------------------------
  # Opt-in context disambiguation: for a form the language pack finds ambiguous
  # (vár = castle / waits) it picks among the pack's OWN readings and the reader
  # says "по контексту". It never adds an analysis. Without it nothing changes.
  #
  # NOT A SMALL CONTAINER. The model (hu_core_news_md, CC BY-SA 4.0, ~127 MB
  # wheel) is published at ~2.4 GB RAM; that is not measured here, so plan for
  # at least 2.5-3 GB free. The image is small; the model is fetched on first
  # use (Settings -> Components, or POST /api/admin/nlp/warmup) into the volume below. Then in
  # Settings point services.nlp at http://nlp:5002 with provider `local`.
  nlp:
    profiles: ['nlp']
    build: ./services/nlp
    container_name: tanulom-nlp
    expose:
      - '5002'
    volumes:
      - tanulom-nlp-models:/models
    # Suggested guard (uncomment on a shared host): mem_limit: 3g
    restart: unless-stopped

  # --- NOT BUILT: speech (tts, asr) -------------------------------------------
  # Planned: Piper voices for card audio, a Whisper fine-tune for dictation. The
  # build contexts are empty, so these are commented out rather than left to
  # fail. The app speaks through the browser's own voices meanwhile (ADR-012).
  #
  # tts:
  #   profiles: ['speech']
  #   build: ./services/tts
  #   expose: ['5000']
  #   volumes: [tanulom-voices:/voices]
  # asr:
  #   profiles: ['speech']
  #   build: ./services/asr
  #   expose: ['5001']
  #   volumes: [tanulom-models:/models]

  # --- optional: sentence translation ---------------------------------------
  # NLLB-200-distilled-600M on your own CPU, so "what does this line mean?" in
  # the reader is answered here instead of in someone else's chat window. The
  # model weights are CC-BY-NC — fine for your own learning, which is why this
  # is opt-in and not in the published image. Build is slow the first time: it
  # downloads and converts ~2.4 GB.
  mt:
    profiles: ['mt']
    build: ./services/mt
    container_name: tanulom-mt
    expose:
      - '5003'
    # NO volume on /models, deliberately. services/mt/Dockerfile converts the
    # weights at BUILD time and bakes them in, so a volume there cannot save a
    # download -- the layer cache already does that -- and it costs 635 MB of
    # duplication. Worse, it SHADOWS the image: the weights would come from the
    # volume while `model` on every response comes from the MT_MODEL env var of
    # the new image, so rebuilding with a different model would label every
    # translation with a name that did not produce it. Labelling is the entire
    # defence for machine translation here [ADR-014]; do not reintroduce this.
    restart: unless-stopped

  # --- optional: local language model ---------------------------------------
  # Alternatively, point Settings -> Services -> LLM at any OpenAI-compatible
  # endpoint. Keys are stored in the database, never in config.yaml.
  ollama:
    profiles: ['llm']
    image: ollama/ollama:latest
    container_name: tanulom-ollama
    expose:
      - '11434'
    environment:
      # Ollama defaults to a 4k context and truncates a longer prompt SILENTLY,
      # from the head -- which is exactly where the tutor puts the lesson it was
      # told to ground the answer in. Measured: a 16,000-character system message
      # came back reported as 2,050 prompt tokens. The tutor's budgets are sized
      # for 8k. See docs/TUTOR.md section 9.
      OLLAMA_CONTEXT_LENGTH: '8192'
    volumes:
      # Pulled models live here, so `ollama pull` survives a recreate. Without
      # it every `docker compose up` re-downloads several GB.
      - tanulom-ollama:/root/.ollama
    restart: unless-stopped

volumes:
  tanulom-data:
  tanulom-nlp-models:
  tanulom-ollama:
