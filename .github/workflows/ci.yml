name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  # Callable as a reusable workflow so the release can gate on it.
  # `needs:` cannot reach a job in another workflow file, and this workflow does
  # not run on tags -- so docker-publish.yml calls this one as a job and depends
  # on THAT. Keeping it here rather than copying the three jobs into the release
  # means the thing CI gates on and the thing a tag gates on cannot drift apart.
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      # The Go build embeds internal/web/dist; provide a placeholder so `go build`
      # works without running the full SPA build in this job.
      - name: Stub embedded SPA
        run: mkdir -p internal/web/dist && echo '<!doctype html><title>stub</title>' > internal/web/dist/index.html
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build

  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The same three checks `make docs-check` (part of `make test`) runs locally:
      # every [Rn] citation resolves to a research note, every note states its
      # code impact, and both locales carry the same keys (ADR-004).
      - run: sh scripts/docs-check.sh
