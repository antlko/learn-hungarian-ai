name: Publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The full CI gate -- backend, frontend, docs -- run against the tagged commit
  # itself. A red build must not become a published `latest` that half the world
  # then pulls.
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is the Python-capable image (target `full`): a fresh install can
      # then add the managed analyser/translator from Settings without changing
      # the tag. The distroless target (`slim`, no Python) is `latest-slim` /
      # `X.Y.Z-slim`. `-full` tags stay published as aliases of the unsuffixed
      # ones so snippets already in the wild keep working. ADR-061.
      #
      # `latest=auto` sets `latest` from a `type=semver` match, and ONLY when the
      # version is not a pre-release -- `v1.2.3` moves it, `v1.2.3-rc1` does not.
      # (`type=raw,value=latest,enable={{is_default_branch}}` publishes NOTHING on
      # a tag push: the ref is compared whole against `main`.)
      - name: Docker metadata (python, unsuffixed)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # The tag as written, so `v1.2.3` is pullable with its leading `v`.
            type=ref,event=tag
            type=sha,format=short

      - name: Docker metadata (python, -full alias)
        id: meta-full
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=-full,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push (python image - latest, X.Y.Z and the -full aliases)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The distroless variant: same tags with a `-slim` suffix (`latest-slim`,
      # `1.2.3-slim`). Layers are shared with the build above.
      - name: Docker metadata (slim)
        id: meta-slim
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=-slim,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push (slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
