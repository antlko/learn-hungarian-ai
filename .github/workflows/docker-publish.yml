name: Publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The full CI gate -- backend, frontend, docs -- run against the tagged commit
  # itself. A red build must not become a published `latest` that half the world
  # then pulls.
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=auto` (the default) sets `latest` from a `type=semver`
          # match, and ONLY when the version is not a pre-release — so
          # `v1.2.3` moves it and `v1.2.3-rc1` does not.
          flavor: latest=auto
          tags: |
            # These three are what makes `latest` work at all. The previous
            # spelling was `type=raw,value=latest,enable={{is_default_branch}}`,
            # which publishes NOTHING here: metadata-action strips only
            # `refs/heads/`, so on `refs/tags/v1.0.0` it compares that whole ref
            # against `main` and never matches. This workflow runs on tags only,
            # so no `latest` was ever pushed — while docker-compose.yml pulls
            # `:latest`. v1.2.3 -> `1.2.3`, `1.2`, `1`, plus `latest`.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # The tag as written, so `v1.2.3` is pullable with its leading `v`.
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The `full` variant (Python inside, for managed components): same tags with
      # a `-full` suffix (`latest-full`, `1.2.3-full`). Layers are shared with the
      # build above, so this is mostly the python base plus a copy.
      - name: Docker metadata (full)
        id: meta-full
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=-full,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push (full)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
